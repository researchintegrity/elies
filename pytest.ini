[pytest]
# Pytest configuration for ELIES System tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for organizing tests
markers =
    registration: User registration tests
    login: User login tests
    deletion: User deletion tests
    integration: Integration tests
    slow: Slow running tests
    e2e: Needs the running stack (API, MongoDB, Redis, Docker, tool images)

# Coverage settings are in pyproject.toml: pytest --cov=app --cov-report=html
