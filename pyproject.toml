# Tool configuration. Dependencies are in requirements*.txt; pytest is
# configured in pytest.ini.

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["system_modules"]

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports/variables), pycodestyle errors and
# lazy logging arguments (no f-strings in log calls). Formatting is not
# enforced yet: reformatting the whole code base would bury real changes.
select = ["E4", "E7", "E9", "F", "G004"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
# Type checking is introduced gradually: the whole app is checked, except
# the modules listed below, which predate it. Remove a module from the list
# once its errors are fixed; new modules must type-check.
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "Found 65 errors in 19 files (checked 67 source files)",
    "app.routes.admin",
    "app.routes.analyses",
    "app.routes.api",
    "app.routes.cbir",
    "app.routes.dual_annotations",
    "app.routes.images",
    "app.routes.jobs",
    "app.routes.single_annotations",
    "app.routes.users",
    "app.services.cbir_service",
    "app.services.image_service",
    "app.services.provenance_service",
    "app.tasks.panel_extraction",
    "app.tasks.watermark_removal",
    "app.utils.docker_cbir",
]
ignore_errors = true
